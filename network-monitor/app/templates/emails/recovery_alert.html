<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a202c; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 30px; text-align: center; border-radius: 12px 12px 0 0; }
        .content { background: #ffffff; padding: 30px; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 12px 12px; }
        .metric { background: #f0fdf4; padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 4px solid #10b981; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-up { background: #c6f6d5; color: #276749; }
        .footer { text-align: center; padding: 20px; color: #718096; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✅ Device RECOVERED</h1>
            <p>Service is back online</p>
        </div>
        <div class="content">
            <h2>{{ device_name }}</h2>
            <p><strong>IP Address:</strong> {{ device_ip }}</p>
            <p><span class="badge badge-up">UP</span></p>
            
            <div class="metric">
                <strong>⏱️ Downtime Duration:</strong> {{ downtime_duration }}
            </div>
            
            <div class="metric">
                <strong>📊 Current Quality Score:</strong> {{ quality_score }}/100
            </div>
            
            <div class="timestamp">
                Recovery Time: {{ timestamp }}
            </div>
        </div>
        <div class="footer">
            <p>NetPulse Network Monitoring System</p>
        </div>
    </div>
</body>
</html>
