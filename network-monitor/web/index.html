<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - Network Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        /* Control Buttons */
        .control-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .btn-start {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .btn-start:hover {
            background: #059669;
        }
        
        .btn-stop {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .btn-stop:hover {
            background: #dc2626;
        }
        
        .status-badge-monitor {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status-running {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-stopped {
            background: #fee2e2;
            color: #991b1b;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
        }
        
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }
        
        .stat-up { color: #10b981; }
        .stat-degraded { color: #f59e0b; }
        .stat-down { color: #ef4444; }
        .stat-unknown { color: #6b7280; }
        
        /* Device Table */
        .device-section {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .section-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .section-header h2 {
            font-size: 18px;
            color: #333;
        }
        
        .add-btn, .refresh-btn {
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            transition: background 0.2s;
        }
        
        .add-btn {
            background: #10b981;
            color: white;
        }
        
        .add-btn:hover {
            background: #059669;
        }
        
        .refresh-btn {
            background: #6b7280;
            color: white;
            margin-right: 10px;
        }
        
        .refresh-btn:hover {
            background: #4b5563;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-up { background: #d1fae5; color: #065f46; }
        .status-degraded { background: #fed7aa; color: #92400e; }
        .status-down { background: #fee2e2; color: #991b1b; }
        .status-unknown { background: #e5e7eb; color: #374151; }
        
        .action-btn {
            padding: 4px 8px;
            margin: 0 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: opacity 0.2s;
        }
        
        .action-btn:hover {
            opacity: 0.8;
        }
        
        .edit-btn {
            background: #3b82f6;
            color: white;
        }
        
        .delete-btn {
            background: #ef4444;
            color: white;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
        }
        
        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .modal-content input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .save-btn {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .cancel-btn {
            background: #6b7280;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #991b1b;
            background: #fee2e2;
            margin: 20px;
            border-radius: 8px;
        }
        
        .info-bar {
            background: #e0f2fe;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .interval-input {
            width: 70px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .info-bar {
                flex-direction: column;
                text-align: center;
            }
            
            .section-header {
                flex-direction: column;
                text-align: center;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🌐 NetPulse</h1>
                <p>Network Monitoring System</p>
            </div>
            <div class="control-buttons">
                <input type="number" id="interval-input" class="interval-input" value="30" min="5" max="300" step="5">
                <button class="btn-start" onclick="startMonitoring()">▶ Start Monitoring</button>
                <button class="btn-stop" onclick="stopMonitoring()">⏹ Stop Monitoring</button>
            </div>
        </div>
        
        <!-- Monitoring Status -->
        <div class="info-bar" id="monitor-status">
            <span>📡 Monitoring: <span id="monitor-running">Checking...</span></span>
            <span>⏱️ Interval: <span id="monitor-interval">-</span> seconds</span>
            <span>🕐 Last check: <span id="last-check">-</span></span>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <h3>Total Devices</h3>
                <div class="stat-number" id="total-devices">0</div>
            </div>
            <div class="stat-card">
                <h3>UP</h3>
                <div class="stat-number stat-up" id="up-count">0</div>
            </div>
            <div class="stat-card">
                <h3>DEGRADED</h3>
                <div class="stat-number stat-degraded" id="degraded-count">0</div>
            </div>
            <div class="stat-card">
                <h3>DOWN</h3>
                <div class="stat-number stat-down" id="down-count">0</div>
            </div>
        </div>
        
        <!-- Device Table -->
        <div class="device-section">
            <div class="section-header">
                <h2>📋 Monitored Devices</h2>
                <div>
                    <button class="refresh-btn" onclick="fetchDevices()">🔄 Refresh</button>
                    <button class="add-btn" onclick="openAddModal()">➕ Add Device</button>
                </div>
            </div>
            <div id="devices-table">
                <div class="loading">Loading devices...</div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Add Device</h3>
            <input type="text" id="device-name" placeholder="Device Name (e.g., Gateway)" autocomplete="off">
            <input type="text" id="device-ip" placeholder="IP Address (e.g., 192.168.1.1)" autocomplete="off">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveDevice()">Save</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000/api';
        let editingDeviceId = null;
        
        // Start monitoring
        async function startMonitoring() {
            const interval = document.getElementById('interval-input').value;
            try {
                const response = await fetch(`${API_URL}/monitoring/start?interval=${interval}`, {
                    method: 'POST'
                });
                if (response.ok) {
                    alert('✅ Monitoring started!');
                    fetchMonitoringStatus();
                } else {
                    const error = await response.json();
                    alert('Failed to start monitoring: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Stop monitoring
        async function stopMonitoring() {
            try {
                const response = await fetch(`${API_URL}/monitoring/stop`, {
                    method: 'POST'
                });
                if (response.ok) {
                    alert('⏹️ Monitoring stopped!');
                    fetchMonitoringStatus();
                } else {
                    const error = await response.json();
                    alert('Failed to stop monitoring: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Fetch monitoring status
        async function fetchMonitoringStatus() {
            try {
                const response = await fetch(`${API_URL}/monitoring/status`);
                const status = await response.json();
                
                const runningSpan = document.getElementById('monitor-running');
                if (status.running) {
                    runningSpan.innerHTML = '<span class="status-badge-monitor status-running">🟢 RUNNING</span>';
                } else {
                    runningSpan.innerHTML = '<span class="status-badge-monitor status-stopped">🔴 STOPPED</span>';
                }
                
                document.getElementById('monitor-interval').textContent = status.interval;
                document.getElementById('last-check').textContent = status.last_check ? new Date(status.last_check).toLocaleTimeString() : 'Never';
            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('monitor-running').innerHTML = '<span class="status-badge-monitor status-stopped">⚠️ ERROR</span>';
            }
        }
        
        // Fetch and display devices
        async function fetchDevices() {
            try {
                const response = await fetch(`${API_URL}/devices`);
                if (!response.ok) throw new Error('Failed to fetch devices');
                const devices = await response.json();
                displayDevices(devices);
                fetchStatus();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('devices-table').innerHTML = 
                    '<div class="error">❌ Failed to load devices. Make sure the API is running at http://localhost:8000</div>';
            }
        }
        
        // Fetch and display status
        async function fetchStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                if (!response.ok) throw new Error('Failed to fetch status');
                const status = await response.json();
                
                document.getElementById('total-devices').textContent = status.total_devices;
                document.getElementById('up-count').textContent = status.devices_up;
                document.getElementById('degraded-count').textContent = status.devices_degraded;
                document.getElementById('down-count').textContent = status.devices_down;
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }
        
        // Display devices in table
        function displayDevices(devices) {
            if (!devices || devices.length === 0) {
                document.getElementById('devices-table').innerHTML = 
                    '<div class="loading">📭 No devices configured. Click "Add Device" to start monitoring.</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>IP Address</th>
                            <th>Status</th>
                            <th>Latency</th>
                            <th>Last Check</th>
                            <th>Downtime</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            for (const device of devices) {
                const statusClass = `status-${device.status.toLowerCase()}`;
                const statusText = device.status;
                const latency = device.latency_ms ? `${device.latency_ms.toFixed(1)}ms` : 'N/A';
                const lastCheck = device.last_check ? new Date(device.last_check).toLocaleTimeString() : 'Never';
                const downtime = device.downtime_display || '-';
                
                html += `
                    <tr>
                        <td><strong>${escapeHtml(device.name)}</strong></td>
                        <td>${escapeHtml(device.ip)}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${latency}</td>
                        <td>${lastCheck}</td>
                        <td>${downtime}</td>
                        <td>
                            <button class="action-btn edit-btn" onclick="openEditModal('${device.id}', '${escapeHtml(device.name)}', '${escapeHtml(device.ip)}')">Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteDevice('${device.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            }
            
            html += `
                    </tbody>
                </table>
            `;
            
            document.getElementById('devices-table').innerHTML = html;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function openAddModal() {
            editingDeviceId = null;
            document.getElementById('modal-title').textContent = 'Add Device';
            document.getElementById('device-name').value = '';
            document.getElementById('device-ip').value = '';
            document.getElementById('modal').style.display = 'flex';
        }
        
        function openEditModal(id, name, ip) {
            editingDeviceId = id;
            document.getElementById('modal-title').textContent = 'Edit Device';
            document.getElementById('device-name').value = name;
            document.getElementById('device-ip').value = ip;
            document.getElementById('modal').style.display = 'flex';
        }
        
        async function saveDevice() {
            const name = document.getElementById('device-name').value.trim();
            const ip = document.getElementById('device-ip').value.trim();
            
            if (!name || !ip) {
                alert('Please enter both name and IP address');
                return;
            }
            
            try {
                if (editingDeviceId) {
                    const response = await fetch(`${API_URL}/devices/${editingDeviceId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, ip })
                    });
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Failed to update device');
                    }
                    alert('✅ Device updated successfully!');
                } else {
                    const response = await fetch(`${API_URL}/devices`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, ip })
                    });
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Failed to add device');
                    }
                    alert('✅ Device added successfully!');
                }
                
                closeModal();
                fetchDevices();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function deleteDevice(id) {
            if (!confirm('Are you sure you want to delete this device?')) return;
            
            try {
                const response = await fetch(`${API_URL}/devices/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete device');
                }
                alert('✅ Device deleted successfully!');
                fetchDevices();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            editingDeviceId = null;
        }
        
        // Auto-refresh every 5 seconds
        let autoRefreshInterval;
        
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                fetchDevices();
                fetchMonitoringStatus();
            }, 5000);
        }
        
        // Initial load
        fetchDevices();
        fetchMonitoringStatus();
        startAutoRefresh();
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
